<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Happy birthday, Edsy</title>

<style>
<style>
body {
    font-family: Arial;
    text-align: center;

    /* Background image */
    background-image: url("edsy.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;

    /* Optional: make sure the page fills the screen */
    min-height: 100vh;
    margin: 0;
}

/* Game grid */
.grid {
    display: grid;
    grid-template-columns: repeat(4, 120px);
    gap: 10px;
    justify-content: center;
    margin: 30px auto;
}

.word {
    padding: 15px;
    background: rgba(255, 255, 255, 0.9);
    border-radius: 8px;
    cursor: pointer;
    border: 2px solid #ddd;
}

.selected {
    background: #ffd54f;
}

.group {
    margin: 10px auto;
    width: 520px;
    padding: 10px;
    border-radius: 8px;
    color: white;
    font-weight: bold;
}

button {
    margin-top: 20px;
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
}
</style>
</style>

</head>

<body>

<h1>Happy birthday, Edsy</h1>

<p id="mistakes">Mistakes remaining: 4</p>

<div id="solved"></div>

<div id="grid" class="grid"></div>

<button onclick="submitGuess()">Submit</button>

<script src="script.js"></script>

</body>
</html>
